[project]
name = "apiverve-websitetotext"
version = "1.2.3"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "Website to Text converts any webpage URL into plain text stripped of HTML tags. It returns the extracted body copy, page title, meta description, publication date, and detected language code."
keywords = ["website to text api", "webpage content api", "website to json", "convert url to text", "extract text from webpage"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/websitetotext?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/websitetotext?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/websitetotext-api"
Twitter = "https://twitter.com/apivervehq"
